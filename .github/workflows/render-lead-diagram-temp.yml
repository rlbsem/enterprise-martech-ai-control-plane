name: Regenerate lead architecture (temporary)
on:
  push:
    branches:
      - docs/control-plane-lead-readable
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Render lead SVG using pinned Mermaid CLI
        shell: bash
        run: |
          set -euo pipefail
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          node node_modules/@mermaid-js/mermaid-cli/src/cli.js \
            -i docs/diagrams/01-control-plane.mmd \
            -o docs/diagrams/01-control-plane.svg \
            -b white -t neutral -p "$RUNNER_TEMP/puppeteer.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          p = Path('docs/diagrams')
          svg = (p/'01-control-plane.svg').read_text()
          width, height = map(float, re.search(r'viewBox="0 0 ([0-9.]+) ([0-9.]+)"', svg).groups())
          print(f'Lead SVG viewBox: {width:.1f} × {height:.1f}')
          if width > 1500 or width / height > 2.7:
              raise SystemExit('Diagram remains too wide')
          m = json.loads((p/'manifest.json').read_text())
          for ext in ('mmd','svg'):
              b = (p/('01-control-plane.'+ext)).read_bytes().replace(b'\r\n',b'\n')
              m['files']['01-control-plane.mmd'][ext] = hashlib.sha256(b).hexdigest()
          (p/'manifest.json').write_text(json.dumps(m, indent=2)+'\n')
          PY
      - name: Commit generated source-aligned SVG and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/01-control-plane.svg docs/diagrams/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Render responsive three-tier control-plane diagram"
            git push origin HEAD:docs/control-plane-lead-readable
          fi
