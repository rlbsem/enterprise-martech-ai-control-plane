name: PostgreSQL governance and recovery
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: control-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-only
          POSTGRES_DB: control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d control_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_ADMIN_DSN: postgresql://postgres:local-admin-only@127.0.0.1:5432/control_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python scripts/verify.py work/ci-evidence
      - name: Larger enterprise workload
        env:
          CONTROL_ADMIN_DSN: postgresql://postgres:local-admin-only@127.0.0.1:5432/control_workload
          CONTROL_WORKLOAD_ENTITIES: "1000"
          CONTROL_WORKLOAD_WORKERS: "4"
          REMOTE_TIMEOUT: "0.5"
          WORKLOAD_OUTPUT: work/ci-evidence/enterprise-workload.json
        run: |
          python -c "import os,psycopg; c=psycopg.connect(os.environ['TEST_ADMIN_DSN'],autocommit=True); c.execute('CREATE DATABASE control_workload'); c.close()"
          python scripts/local_demo.py
      - name: Independent destination-capacity smoke execution
        run: |
          python scripts/isolation_acceptance.py --admin postgresql://postgres:local-admin-only@127.0.0.1:5432/control_test --output work/isolation-ci --duration 60 --proposals 100 --fault mixed
          mkdir -p work/ci-evidence/isolation
          cp work/isolation-ci/protocol.json work/isolation-ci/observations.json work/isolation-ci/result.json work/ci-evidence/isolation/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: postgres-http-proof
          path: work/ci-evidence
          if-no-files-found: warn
      - name: Retain smoke observations even when its acceptance gate fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: destination-capacity-observations
          path: |
            work/isolation-ci/protocol.json
            work/isolation-ci/observations.json
            work/isolation-ci/result.json
            work/isolation-ci/cleanup.json
          if-no-files-found: warn
  container-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose run --build --rm demo
      - name: Verify all tests from the built image
        run: docker compose --profile test run --rm verify
      - name: Export source-bound native acceptance image without AWS access
        run: |
          mkdir -p work/native-image
          docker buildx create --name native-export --driver docker-container --use
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --output type=oci,dest=work/native-image/image.oci.tar .
          sha256sum work/native-image/image.oci.tar > work/native-image/SHA256SUMS
          printf '%s\n' '${{ github.sha }}' > work/native-image/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-acceptance-image
          path: work/native-image
          retention-days: 1
          if-no-files-found: error
      - if: always()
        run: docker compose down --volumes
