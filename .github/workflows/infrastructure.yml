name: Infrastructure and architecture
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install checksum-verified tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infra-tools"
          cd "$RUNNER_TEMP/infra-tools"
          curl --fail --location --silent --show-error -O https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_linux_amd64.zip
          curl --fail --location --silent --show-error -O https://releases.hashicorp.com/terraform/1.13.5/terraform_1.13.5_SHA256SUMS
          grep ' terraform_1.13.5_linux_amd64.zip$' terraform_1.13.5_SHA256SUMS | sha256sum --check
          unzip terraform_1.13.5_linux_amd64.zip
          curl --fail --location --silent --show-error -O https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          curl --fail --location --silent --show-error -O https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt
          grep ' trivy_0.75.0_Linux-64bit.tar.gz$' trivy_0.75.0_checksums.txt | sha256sum --check
          tar -xzf trivy_0.75.0_Linux-64bit.tar.gz trivy
          echo "$RUNNER_TEMP/infra-tools" >> "$GITHUB_PATH"
      - run: python scripts/validate_infra.py
      - name: Source and documentation integrity
        run: python scripts/repo_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: infrastructure-proof
          path: work/infra-proof
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - name: Parse and render all architecture diagrams
        run: |
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          PUPPETEER_CONFIG="$RUNNER_TEMP/puppeteer.json" python scripts/render_diagrams.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-architecture
          path: docs/diagrams/*.svg
