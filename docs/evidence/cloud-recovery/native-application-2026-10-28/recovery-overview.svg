<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-labelledby="title desc">
<title id="title">Native AWS RDS recovery: expected block followed by verified resumption</title>
<desc id="desc">Two separate AWS point-in-time restores of the application control database are compared with the same independent downstream receipt database. The early restore recovers three intents against five existing effects and correctly blocks execution. The later restore reconciles five intents with five receipts, requires fresh approval and consent, and independently verifies six intents and six effects with zero duplicates. Bounded synthetic Fargate application acceptance, not full production deployment.</desc>
