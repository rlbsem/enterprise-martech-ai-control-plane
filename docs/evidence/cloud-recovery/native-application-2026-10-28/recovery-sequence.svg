<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="725" viewBox="0 0 1300 725" role="img" aria-labelledby="title desc">
<title id="title">Native AWS application recovery, two executed RDS point-in-time restores</title><desc id="desc">The isolated source had five control intents and five independent downstream receipts. An earlier RDS point-in-time restore yielded three intents against five unchanged effects and safely blocked execution. After deleting that restored generation, a later distinct RDS restore reconciled five intents against five receipts, required fresh authorization, rejected stale worker completion and revoked consent, and finished with six independently verified intents and six effects without duplicates. Synthetic one-off Fargate task acceptance; not full production ECS, HTTPS or Multi-AZ certification.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10101D"/><stop offset="1" stop-color="#181825"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#B8B8FF"/></marker></defs>
<rect width="1300" height="725" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1298" height="723" rx="19" fill="none" stroke="#62628B" stroke-width="1.5"/>
<g font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
<rect x="47" y="31" width="5" height="85" rx="2.5" fill="#B8B8FF"/>
<text x="69" y="57" font-size="17" font-weight="700" fill="#C1B9FF" letter-spacing="1.5">EXECUTED AWS ACCEPTANCE / 28 OCT 2026</text>
<text x="69" y="97" font-size="33" font-weight="700" fill="#F0F0FF">Database restored. Is execution safe to resume?</text>
<rect x="1012" y="43" width="230" height="39" rx="18" fill="#2A2A3D" stroke="#7C7CAF" stroke-width="1.5"/>
<text x="1127" y="68" font-size="16" font-weight="700" fill="#D9D8FF" text-anchor="middle">RDS PITR  ·  us-east-2</text>
<rect x="49" y="132" width="1202" height="92" rx="14" fill="#202035" stroke="#7C7CAF" stroke-width="1.5"/>
<text x="72" y="161" font-size="15" font-weight="700" fill="#B8B8FF" letter-spacing="1">SOURCE CHECKPOINT / PRE-RESTORE STATE</text>
<text x="72" y="194" font-size="24" font-weight="700" fill="#F0F0FF">5 control intents  =  5 independent downstream receipts</text>
<text x="825" y="194" font-size="15" font-weight="400" fill="#D2D2E6">Original receipt database unchanged across restores</text>
<text x="52" y="264" font-size="18" font-weight="700" fill="#E3BC7F" letter-spacing="1">01  EARLIER RESTORE / UNSAFE STATE</text>
<rect x="50" y="282" width="375" height="154" rx="14" fill="#25253A" stroke="#7C7CAF" stroke-width="1.5"/>
<text x="72" y="311" font-size="15" font-weight="700" fill="#C4B8FF" letter-spacing="1">RESTORE POINT 01</text>
<text x="72" y="346" font-size="24" font-weight="700" fill="#F0F0FF">3 restored control intents</text>
<text x="72" y="377" font-size="17" font-weight="400" fill="#D4D4E7">2026-10-28 20:18:23 UTC</text>
<text x="72" y="407" font-size="16" font-weight="400" fill="#C4C4DD">First new RDS control generation</text>
<path d="M430 359 H451" fill="none" stroke="#B8B8FF" stroke-width="2.3" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="461" y="282" width="375" height="154" rx="14" fill="#25253A" stroke="#E3BC7F" stroke-width="1.8"/>
<text x="483" y="311" font-size="15" font-weight="700" fill="#E3BC7F" letter-spacing="1">INDEPENDENT COMPARISON</text>
<text x="483" y="346" font-size="24" font-weight="700" fill="#F0F0FF">5 existing remote receipts</text>
<text x="483" y="377" font-size="17" font-weight="400" fill="#FFE0AA">2 remote-ahead missing intents</text>
<text x="483" y="407" font-size="16" font-weight="400" fill="#C4C4DD">No replay assumed safe</text>
<path d="M841 359 H862" fill="none" stroke="#B8B8FF" stroke-width="2.3" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="872" y="282" width="377" height="154" rx="14" fill="#332A37" stroke="#D98EA3" stroke-width="2"/>
<text x="894" y="311" font-size="15" font-weight="700" fill="#F5B4C5" letter-spacing="1">EXECUTION GATE</text>
<text x="894" y="346" font-size="28" font-weight="700" fill="#FFC6D3">BLOCKED</text>
<text x="894" y="377" font-size="18" font-weight="400" fill="#F4C2CF">safe_to_resume = false</text>
<text x="894" y="407" font-size="16" font-weight="400" fill="#E3CFD6">Worker claimed no work</text>
<path d="M50 469 H1249" stroke="#55556F" stroke-dasharray="5 7" stroke-width="1.4"/>
<text x="649" y="462" font-size="15" font-weight="400" fill="#C5C5DA" text-anchor="middle">First restored generation deleted before the distinct later restore</text>
<text x="52" y="508" font-size="18" font-weight="700" fill="#81C5B0" letter-spacing="1">02  LATER RESTORE / GOVERNED RESUMPTION</text>
<rect x="50" y="526" width="375" height="154" rx="14" fill="#25253A" stroke="#7C7CAF" stroke-width="1.5"/>
<text x="72" y="555" font-size="15" font-weight="700" fill="#C4B8FF" letter-spacing="1">RESTORE POINT 02</text>
<text x="72" y="590" font-size="24" font-weight="700" fill="#F0F0FF">5 restored control intents</text>
<text x="72" y="621" font-size="17" font-weight="400" fill="#D4D4E7">2026-10-28 20:23:32 UTC</text>
<text x="72" y="651" font-size="16" font-weight="400" fill="#C4C4DD">Distinct physical RDS generation</text>
<path d="M430 603 H451" fill="none" stroke="#B8B8FF" stroke-width="2.3" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="461" y="526" width="375" height="154" rx="14" fill="#25253A" stroke="#B8B8FF" stroke-width="1.8"/>
<text x="483" y="555" font-size="15" font-weight="700" fill="#C4B8FF" letter-spacing="0.6">FRESH EVIDENCE AND CONTROL</text>
<text x="483" y="589" font-size="23" font-weight="700" fill="#F0F0FF">5 intents = 5 receipts</text>
<text x="483" y="621" font-size="17" font-weight="400" fill="#D4D4E7">New exact proof and approval</text>
<text x="483" y="650" font-size="15" font-weight="400" fill="#C4C4DD">Stale completion + revoked consent rejected</text>
<path d="M841 603 H862" fill="none" stroke="#B8B8FF" stroke-width="2.3" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="872" y="526" width="377" height="154" rx="14" fill="#21342F" stroke="#81C5B0" stroke-width="2"/>
<text x="894" y="555" font-size="15" font-weight="700" fill="#98E5CE" letter-spacing="1">INDEPENDENT FINAL CHECK</text>
<text x="894" y="590" font-size="25" font-weight="700" fill="#F0F0FF">6 intents / 6 effects</text>
<text x="894" y="622" font-size="18" font-weight="700" fill="#A8EFD5">SAFE TO RESUME</text>
<text x="894" y="652" font-size="17" font-weight="400" fill="#BCE8DA">Zero duplicate effects</text>
<text x="51" y="709" font-size="14" font-weight="400" fill="#BFC0D7">SCOPE: actual AWS RDS PITR with synthetic one-off Fargate tasks  |  max 2 concurrent RDS instances  |  not full production ECS/HTTPS/Multi-AZ acceptance</text>
</g></svg>
