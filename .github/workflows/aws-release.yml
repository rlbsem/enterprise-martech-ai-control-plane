name: Controlled AWS release
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operate the approved environment manifest"
        type: choice
        options: [deploy, quiesce, verify, resume, rollback]
        required: true
permissions:
  contents: read
concurrency:
  group: aws-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOYMENT == 'true'
    environment: aws-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation .
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ca-central-1
          role-session-name: control-release-${{ github.run_id }}
      - name: Validate approved manifest and operate
        env:
          RELEASE_MANIFEST: ${{ vars.AWS_RELEASE_MANIFEST }}
          RELEASE_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,os,pathlib; p=pathlib.Path("work/release.json"); p.parent.mkdir(exist_ok=True); p.write_text(json.dumps(json.loads(os.environ["RELEASE_MANIFEST"])))'
          python -m controlplane.release "$RELEASE_ACTION" --manifest work/release.json --record work/release-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aws-release-record
          path: work/release-record.json
          if-no-files-found: warn
