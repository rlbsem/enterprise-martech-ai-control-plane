name: Render Groundbreakers diagram pilot (temporary)
on:
  push:
    branches:
      - visual/groundbreakers-diagram-pilot
    paths:
      - docs/diagrams/01-control-plane.mmd
      - docs/diagrams/groundbreakers-mermaid.json
      - docs/diagrams/render_groundbreakers_pilot.py
      - .github/workflows/brand-diagram-pilot.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Generate authoritative SVG from Mermaid
        run: |
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          PUPPETEER_CONFIG="$RUNNER_TEMP/puppeteer.json" python docs/diagrams/render_groundbreakers_pilot.py
      - name: Commit generated SVG and manifest to pilot branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/01-control-plane.svg docs/diagrams/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate branded SVG and diagram manifest"
            git push origin HEAD:visual/groundbreakers-diagram-pilot
          fi
