name: PostgreSQL governance and recovery
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: control-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-only
          POSTGRES_DB: control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d control_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_ADMIN_DSN: postgresql://postgres:local-admin-only@127.0.0.1:5432/control_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python scripts/verify.py work/ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: postgres-http-proof
          path: work/ci-evidence
          if-no-files-found: warn
  container-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose run --build --rm demo
      - if: always()
        run: docker compose down --volumes
